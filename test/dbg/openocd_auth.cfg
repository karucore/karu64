# Debug authentication with pinned pristine OpenOCD (doc/debug-auth-contract.md
# section 2): examine fails on authenticated=0, the authdata mailbox runs the
# island ROM stub's protocol, dmstatus is polled with a raw DMI read, and
# arp_examine then attaches without another dmactive pulse. A manual dmactive
# pulse, as a reconnect performs, keeps the grant.
# SPDX-License-Identifier: BSD-2-Clause
adapter driver remote_bitbang
remote_bitbang host 127.0.0.1
remote_bitbang port $::env(KARUDBG_RBB_PORT)
transport select jtag
adapter speed 1000
reset_config none
telnet port disabled
tcl port disabled
gdb port disabled
jtag newtap karu cpu -irlen 5 -expected-id 0x00000db3
target create karu.cpu riscv -tap karu.cpu -coreid 0
riscv set_command_timeout_sec 2

proc check_equal {actual expected label} {
    if {$actual != $expected} { error "$label: $actual != $expected" }
}
proc poll_until {cmd mask want label} {
    for {set n 0} {$n < 2000} {incr n} {
        set v [eval $cmd]
        if {($v & $mask) == $want} { return $v }
    }
    error "$label: timed out ($v)"
}

# init examines the target; with authenticated=0 it must fail to attach.
init
if {[karu.cpu was_examined]} { error "examined while locked" }
check_equal [expr {[riscv dmi_read 0x11] & 0xff}] 0x03 "locked dmstatus: version only"

# Mailbox: REQUEST, read the challenge, send the response.
riscv authdata_write 0x10a50001
poll_until {riscv authdata_read} 0x1f 1 "challenge in TX"
riscv authdata_write 0x30000001
check_equal [riscv authdata_read] 0xc0de0001 "challenge word"
riscv authdata_write 0x20000001
riscv authdata_write 0x600df00d
poll_until {riscv dmi_read 0x11} 0x80 0x80 "dmstatus.authenticated"
echo "authenticated"

karu.cpu arp_examine
if {![karu.cpu was_examined]} { error "arp_examine did not attach after authentication" }
halt
wait_halt 2000
reg a0 0x0123456789abcdef
check_equal [dict get [get_reg -force a0] a0] 0x0123456789abcdef "GPR round trip after authentication"

# A reconnect pulses dmactive; the POR-domain grant survives it.
resume
riscv dmi_write 0x10 0
poll_until {riscv dmi_read 0x10} 1 0 "dmactive deasserted"
riscv dmi_write 0x10 1
poll_until {riscv dmi_read 0x10} 1 1 "dmactive reasserted"
check_equal [expr {[riscv dmi_read 0x11] & 0x80}] 0x80 "grant survives a dmactive pulse"
echo "PASS OpenOCD debug authentication"
shutdown
