# Shared hart connection; tests select features and override memory access as needed.
# SPDX-License-Identifier: BSD-2-Clause
adapter driver remote_bitbang
remote_bitbang host 127.0.0.1
remote_bitbang port $::env(KARUDBG_RBB_PORT)
transport select jtag
adapter speed 1000
reset_config none
telnet port disabled
tcl port disabled
if {[info exists ::env(KARUDBG_GDB_PORT)]} {
    gdb port $::env(KARUDBG_GDB_PORT)
} else {
    gdb port disabled
}
if {[info exists ::env(KARUDBG_BSCAN)]} {
    jtag newtap karu fpga -irlen 6 -expected-id 0x04b31093
    target create karu.cpu riscv -tap karu.fpga -coreid 0
    riscv use_bscan_tunnel 5 0
    riscv set_bscan_tunnel_ir 0x23
} else {
    set _KARUDBG_IDCODE 0x00000db3
    if {[info exists ::env(KARUDBG_IDCODE)]} { set _KARUDBG_IDCODE $::env(KARUDBG_IDCODE) }
    jtag newtap karu cpu -irlen 5 -expected-id $_KARUDBG_IDCODE
    target create karu.cpu riscv -tap karu.cpu -coreid 0
}
riscv mem_access progbuf
riscv set_command_timeout_sec 2
init
halt
wait_halt 2000

proc check_equal {actual expected label} {
    if {$actual != $expected} { error "$label: $actual != $expected" }
}
proc read_reg_value {name} { return [dict get [get_reg -force $name] $name] }
