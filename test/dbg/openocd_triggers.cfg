# Native OpenOCD address-trigger allocation and precise continuation.
# SPDX-License-Identifier: BSD-3-Clause
source test/dbg/openocd_common.cfg
source test/dbg/openocd_trigger_address.tcl

# Both slots may be allocated together; a third must fail cleanly.
bp 0x80007000 4 hw
wp 0x80006000 4 w
if {![catch {bp 0x80007018 4 hw}]} { error "third trigger unexpectedly allocated" }
rbp 0x80007000
rwp 0x80006000
bp 0x80007018 4 hw
rbp 0x80007018
# Combined extensions: autoexec register reads while a data watchpoint is
# armed, then independent physical SBA while that hart runs without loads.
wp 0x80006000 4 a
proc wait_abstract_idle {} {
    for {set n 0} {$n < 100} {incr n} {
        set status [riscv dmi_read 0x16]
        if {($status & 0x1000) == 0} {
            if {$status & 0x700} { error "combined autoexec command error" }
            return
        }
    }
    error "combined autoexec command timeout"
}
riscv dmi_write 0x18 0
riscv dmi_write 0x17 0x0032100c
wait_abstract_idle
riscv dmi_write 0x18 1
check_equal [riscv dmi_read 0x04] 2 "autoexec GPR read with armed watchpoint"
wait_abstract_idle
riscv dmi_write 0x18 0
check_equal [riscv dmi_read 0x04] 2 "autoexec command result with armed watchpoint"
riscv mem_access sysbus
resume 0x80007018
check_equal [lindex [read_memory 0x80006000 32 1 phys] 0] 2 "SBA read excludes CPU watchpoint matching"
poll
if {[karu.cpu curstate] ne "running"} { error "SBA read triggered the hart watchpoint" }
write_memory 0x80006000 32 {3} phys
check_equal [lindex [read_memory 0x80006000 32 1 phys] 0] 3 "SBA write excludes CPU watchpoint matching"
poll
if {[karu.cpu curstate] ne "running"} { error "SBA write triggered the hart watchpoint" }
halt
wait_halt 2000
rwp 0x80006000
riscv mem_access progbuf
echo "PASS OpenOCD hardware breakpoints watchpoints slots continuation"
shutdown
