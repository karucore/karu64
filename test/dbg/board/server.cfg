# OpenOCD server for the board acceptance phases that use the reset-halted
# fixture. Start it from the repository root and wait for the ready line:
#
#   openocd -f test/dbg/board/server.cfg
#
# Environment (same names as test/dbg/board/boardlib.py):
#   KARU_BOARD_RPC          Tcl RPC endpoint      (127.0.0.1:6666)
#   KARU_BOARD_GDB_REMOTE   GDB server endpoint   (127.0.0.1:3333)
#   KARU_BOARD_ADAPTER_CFG  adapter script        (interface/ftdi/digilent_jtag_smt2_nc.cfg)
#   KARU_BOARD_TARGET_CFG   board/target script   (dbg/vcu118.cfg)
# SPDX-License-Identifier: BSD-2-Clause
proc karu_env {name default} {
    if {[info exists ::env($name)] && $::env($name) ne ""} { return $::env($name) }
    return $default
}
proc karu_port {name default} { return [lindex [split [karu_env $name $default] :] end] }
bindto 127.0.0.1
tcl port [karu_port KARU_BOARD_RPC 127.0.0.1:6666]
telnet port disabled
gdb port [karu_port KARU_BOARD_GDB_REMOTE 127.0.0.1:3333]
source [find [karu_env KARU_BOARD_ADAPTER_CFG interface/ftdi/digilent_jtag_smt2_nc.cfg]]
source [karu_env KARU_BOARD_TARGET_CFG dbg/vcu118.cfg]
riscv set_command_timeout_sec 10
init
echo BOARD_ACCEPT_SERVER_READY
