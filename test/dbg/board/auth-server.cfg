# OpenOCD server for auth_phase.py: the debug authentication cases.
#
# The target may be locked, so it is not examined at init: a locked Debug
# Module refuses the examine, and auth_phase.py asks for it itself, before
# and after the exchange. The EBREAK-to-debug controls are left off, as in
# linux-server.cfg, because an authenticated attach happens while the
# firmware boots. Environment as in server.cfg.
#
# Start it from the repository root after the CPU reset button, and afresh
# for every case: an OpenOCD that has examined the target keeps its view of
# it across a reset.
#
#   openocd -f test/dbg/board/auth-server.cfg
# SPDX-License-Identifier: BSD-2-Clause
proc karu_env {name default} {
    if {[info exists ::env($name)] && $::env($name) ne ""} { return $::env($name) }
    return $default
}
proc karu_port {name default} { return [lindex [split [karu_env $name $default] :] end] }
bindto 127.0.0.1
tcl port [karu_port KARU_BOARD_RPC 127.0.0.1:6666]
telnet port disabled
gdb port [karu_port KARU_BOARD_GDB_REMOTE 127.0.0.1:3333]
source [find [karu_env KARU_BOARD_ADAPTER_CFG interface/ftdi/digilent_jtag_smt2_nc.cfg]]
source [karu_env KARU_BOARD_TARGET_CFG dbg/vcu118.cfg]
karu.cpu configure -defer-examine
riscv set_command_timeout_sec 10
riscv set_ebreakm off
riscv set_ebreaks off
riscv set_ebreaku off
init
echo BOARD_ACCEPT_SERVER_READY
