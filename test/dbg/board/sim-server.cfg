# OpenOCD server for rehearsing board cases against the simulated JTAG
# target (test/dbg/tb_jtag_core.v over remote_bitbang); see rehearse.py.
# KARUDBG_RBB_PORT is the simulator's port, KARU_BOARD_RPC the Tcl RPC
# endpoint the harness connects to.
# SPDX-License-Identifier: BSD-2-Clause
adapter driver remote_bitbang
remote_bitbang host 127.0.0.1
remote_bitbang port $::env(KARUDBG_RBB_PORT)
transport select jtag
adapter speed 1000
reset_config none
bindto 127.0.0.1
tcl port [lindex [split $::env(KARU_BOARD_RPC) :] end]
telnet port disabled
gdb port disabled
jtag newtap karu cpu -irlen 5 -expected-id 0x00000db3
target create karu.cpu riscv -tap karu.cpu -coreid 0
riscv mem_access progbuf
riscv set_command_timeout_sec 10
init
echo BOARD_ACCEPT_SERVER_READY
