# Real hart register, memory, peripheral and run-control acceptance.
# SPDX-License-Identifier: BSD-2-Clause
source test/dbg/openocd_common.cfg

reg a0 0x0123456789abcdef
check_equal [read_reg_value a0] 0x0123456789abcdef "GPR round trip"
reg mscratch 0x1234fedc5678abcd
check_equal [read_reg_value mscratch] 0x1234fedc5678abcd "CSR round trip"
write_memory 0x80002000 32 {0x01234567 0x89abcdef 0xdeadbeef}
set ram [read_memory 0x80002000 32 3]
check_equal [lindex $ram 0] 0x01234567 "RAM word 0"
check_equal [lindex $ram 1] 0x89abcdef "RAM word 1"
check_equal [lindex $ram 2] 0xdeadbeef "RAM word 2"

# Exercise every scalar width with both individual and block accesses.
foreach width {8 16 32 64} {
    foreach count {1 2 5} {
        set values {}
        for {set n 0} {$n < $count} {incr n} {
            if {$width == 64} { set value [expr {0x123456789abc0000+$n}] } else {
                set value [expr {(0xabcdef00+$n) & ((1 << $width)-1)}]
            }
            lappend values $value
        }
        write_memory 0x80003000 $width $values
        set actual [read_memory 0x80003000 $width $count]
        for {set n 0} {$n < $count} {incr n} {
            check_equal [lindex $actual $n] [lindex $values $n] "RAM width=$width count=$count item=$n"
        }
    }
}

# Read-to-clear and FIFO devices expose speculative/duplicate accesses.
set first [read_memory 0x10000000 32 1]
check_equal [lindex $first 0] 0x87654321 "read-to-clear value"
check_equal [lindex [read_memory 0x10000028 32 1] 0] 1 "exact one device read"
set fifo [read_memory 0x10000008 32 1]
check_equal [lindex $fifo 0] 0xa5a50000 "single FIFO read"
check_equal [lindex [read_memory 0x10000020 32 1] 0] 1 "single FIFO count"
set fifo [read_memory 0x10000008 32 3]
check_equal [lindex $fifo 0] 0xa5a50001 "block FIFO read 0"
check_equal [lindex $fifo 1] 0xa5a50002 "block FIFO read 1"
check_equal [lindex $fifo 2] 0xa5a50003 "block FIFO read 2"
check_equal [lindex [read_memory 0x10000020 32 1] 0] 4 "block FIFO exact count"
set fifo [read_memory 0x10000008 32 5]
for {set n 0} {$n < 5} {incr n} {
    check_equal [lindex $fifo $n] [expr {0xa5a50004+$n}] "five-element FIFO item $n"
}
check_equal [lindex [read_memory 0x10000020 32 1] 0] 9 "five-element FIFO exact count"
if {![catch {read_memory 0x10000080 32 1}]} { error "Missing device error" }
check_equal [lindex [read_memory 0x80002000 32 1] 0] 0x01234567 "recovery after device error"

# Code updates, precise stepping, and resume/halt through the ROM.
write_memory 0x80001000 32 {0x02a00513 0x00150513 0x0000006f}
reg pc 0x80001000
step
check_equal [read_reg_value pc] 0x80001004 "first step PC"
check_equal [read_reg_value a0] 42 "first step result"
step
check_equal [read_reg_value pc] 0x80001008 "second step PC"
check_equal [read_reg_value a0] 43 "second step result"
resume 0x80000000
sleep 10
halt
wait_halt 2000
# Failed explicit commands replace the autoexec cache too. Otherwise the final
# DATA0 read below would replay the old device-load Program Buffer command.
# Probe the optional mask so the same scenario retains the base-DM fallback.
# Do not mix deferred OpenOCD register writes or periodic target polling with
# raw DMI command/error state. Flush and invalidate the client context first.
poll off
riscv exec_progbuf 0x00000013
riscv dmi_write 0x18 1
set has_autoexec [expr {([riscv dmi_read 0x18] & 1) != 0}]
riscv dmi_write 0x18 0
if {$has_autoexec} {
    proc cached_command_done {} {
        for {set attempt 0} {$attempt < 100} {incr attempt} {
            set status [riscv dmi_read 0x16]
            if {($status & 0x1000) == 0} { return $status }
            sleep 1
        }
        error "cached-command probe timed out"
    }
    set before [lindex [read_memory 0x10000028 32 1] 0]
    # read_memory may borrow registers; finish its client context before the
    # raw experiment, then write architectural a1 without deferred caching.
    riscv exec_progbuf 0x00000013
    riscv dmi_write 0x04 0x10000000
    riscv dmi_write 0x05 0
    riscv dmi_write 0x17 0x0033100b
    check_equal [expr {([cached_command_done] >> 8) & 7}] 0 "raw device base GPR write"
    set saved_pb {}
    for {set word 0} {$word < 8} {incr word} {
        lappend saved_pb [riscv dmi_read [expr {0x20+$word}]]
    }
    riscv dmi_write 0x20 0x0005a503
    riscv dmi_write 0x21 0x00100073
    riscv dmi_write 0x17 0x00040000
    check_equal [expr {([cached_command_done] >> 8) & 7}] 0 "initial counted device command"
    riscv dmi_write 0x17 0x01000000
    check_equal [expr {([cached_command_done] >> 8) & 7}] 2 "explicit unsupported command"
    # Exceed the normal poll period while the unsupported-command error is
    # sticky. Polling stays disabled until the complete raw sequence ends.
    sleep 120
    riscv dmi_write 0x16 0x700
    riscv dmi_write 0x18 1
    riscv dmi_read 0x04
    check_equal [expr {([cached_command_done] >> 8) & 7}] 2 "autoexec retries unsupported command"
    # Disable autoexec before any normal OpenOCD memory operation.
    riscv dmi_write 0x18 0
    riscv dmi_write 0x16 0x700
    for {set word 0} {$word < 8} {incr word} {
        riscv dmi_write [expr {0x20+$word}] [lindex $saved_pb $word]
    }
    # Reconcile the client register cache after raw Program Buffer execution.
    riscv exec_progbuf 0x00000013
    check_equal [lindex [read_memory 0x10000028 32 1] 0] [expr {$before+1}] "failed command never replays MMIO"
    echo "PASS autoexec failed-command cache exact MMIO count"
}
poll on
echo "PASS OpenOCD real hart register memory MMIO step resume"
shutdown
