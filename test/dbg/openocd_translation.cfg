# Software-walk interoperability, checked against independent sentinels and
# representative normal-execution hardware walks. No application trap entry.
# SPDX-License-Identifier: BSD-3-Clause
source test/dbg/openocd_common.cfg
riscv virt2phys_mode sw
set checks 0
set initial_dcsr [read_reg_value dcsr]
set initial_mstatus [read_reg_value mstatus]
set initial_menvcfg [read_reg_value menvcfg]
set fault_saved {}

proc pte {physical flags} { return [expr {(($physical >> 12) << 10) | $flags}] }
proc put {address value} { write_memory $address 64 [list $value] phys }
proc expect_word {address expected label} {
    global checks
    check_equal [lindex [read_memory $address 32 1] 0] $expected $label
    incr checks
}
proc host_mode {} {
    global initial_dcsr
    reg dcsr [expr {($initial_dcsr & ~0x23) | 1}]
}
proc guest_mode {} {
    global initial_dcsr
    reg dcsr [expr {($initial_dcsr & ~0x23) | 0x21}]
}
proc trap_snapshot {} {
    set saved {}
    foreach name {mepc mcause mtval sepc scause stval vsepc vscause vstval mtval2 mtinst htval htinst pc} {
        dict set saved $name [read_reg_value $name]
    }
    return $saved
}
proc expect_unchanged {saved label} {
    foreach name [dict keys $saved] {
        check_equal [read_reg_value $name] [dict get $saved $name] "$label preserves $name"
    }
}
proc expect_failure {address label} {
    global checks fault_saved
    if {[dict size $fault_saved] == 0} { set fault_saved [trap_snapshot] }
    if {![catch {read_memory $address 32 1}]} { error "$label silently accepted" }
    expect_unchanged $fault_saved $label
    incr checks
}
proc hardware_load {address expected label} {
    global checks fault_saved
    # Code is identity mapped in host/VS at VA 0x80000100. SFENCE.VMA
    # invalidates prior page-walk state before the normal S/VS data access.
    set lui [expr {(($address >> 12) << 12) | (11 << 7) | 0x37}]
    write_memory 0x80000100 32 [list 0x12000073 $lui 0x0005a503 0x00100073] phys
    set dcsr [read_reg_value dcsr]
    reg dcsr [expr {$dcsr | (1 << 13) | (1 << 17)}]
    resume 0x80000100
    wait_halt 2000
    check_equal [read_reg_value a0] $expected "$label hardware data"
    check_equal [expr {([read_reg_value dcsr] >> 6) & 7}] 1 "$label EBREAK entry"
    set fault_saved {}
    incr checks
}

# Host Sv39: three table pages, two independently initialized data pages.
put 0x80004000 0x13579bdf
put 0x80005000 0x2468ace0
put 0x80001000 [pte 0x80002000 1]
put 0x80001010 [pte 0x80000000 0xcf]
put 0x80002010 [pte 0x80003000 1]
put 0x80003000 [pte 0x80004000 0xcf]
reg satp 0x8000000000080001
host_mode
expect_word 0x00400000 0x13579bdf "host 4KiB"
hardware_load 0x00400000 0x13579bdf "host 4KiB"
put 0x80002010 [pte 0x80000000 0xcf]
expect_word 0x00404000 0x13579bdf "host 2MiB"
hardware_load 0x00404000 0x13579bdf "host 2MiB"
put 0x80001008 [pte 0x80000000 0xcf]
expect_word 0x40004000 0x13579bdf "host 1GiB"
hardware_load 0x40004000 0x13579bdf "host 1GiB"
put 0x80002010 [pte 0x80001000 0xcf]
expect_failure 0x00404000 "misaligned 2MiB leaf"
put 0x80001008 [pte 0x80200000 0xcf]
expect_failure 0x40004000 "misaligned 1GiB leaf"
put 0x80001008 0
expect_failure 0x40004000 "missing host leaf"
put 0x80002010 [pte 0x80003000 1]

# A complete 64KiB NAPOT fixture. Software support is explicitly absent:
# the local guard must report an error, rather than return a wrong 4KiB page.
set napot [pte 0x80008000 0x80000000000000cf]
set entries {}
for {set n 0} {$n < 16} {incr n} { lappend entries $napot }
write_memory 0x80003000 64 $entries phys
put 0x8000a000 0x55667788
expect_failure 0x0040a000 "host Svnapot unsupported"
put 0x80003000 [pte 0x80004000 0xcf]

# Record debugger policy, rather than claiming hardware permission emulation.
put 0x80003000 [pte 0x80004000 0xc9]
reg mstatus [expr {$initial_mstatus & ~(1 << 19)}]
expect_word 0x00400000 0x13579bdf "software ignores MXR=0 execute-only load restriction"
put 0x80003000 [pte 0x80004000 0xdf]
reg mstatus [expr {$initial_mstatus & ~(1 << 18)}]
expect_word 0x00400000 0x13579bdf "software ignores SUM=0 U-page restriction"
put 0x80003000 [pte 0x80004000 0x0f]
expect_word 0x00400000 0x13579bdf "software ignores A/D clear"
check_equal [lindex [read_memory 0x80003000 64 1 phys] 0] [pte 0x80004000 0x0f] "software does not set A/D"
foreach attribute {0x2000000000000000 0x4000000000000000} {
    put 0x80003000 [pte 0x80004000 [expr {$attribute | 0xcf}]]
    expect_word 0x00400000 0x13579bdf "software ignores PBMT attribute $attribute"
}
put 0x80003000 [pte 0x80004000 0xcf]
reg menvcfg [expr {$initial_menvcfg | (2 << 32)}]
expect_failure 0xfe00000000400000 "software does not strip PMM-tagged pointer"
reg menvcfg $initial_menvcfg
reg mstatus $initial_mstatus
echo "POLICY software walk ignores SUM/MXR/U permissions and A/D, leaves A/D unchanged, ignores PBMT, rejects tagged pointers"

# Guest Sv39 over Sv39x4. The 16KiB G root is at 0x80008000.
# VS roots and all their pointer PTEs use GPAs ABOVE 4GiB. The G mapping
# translates those PTE reads to independent physical pages in the RAM fixture.
put 0x80008020 [pte 0x8000c000 1]
put 0x8000c000 [pte 0x8000d000 1]
foreach page {0 4 6 7 14} {
    put [expr {0x8000d000 + $page * 8}] [pte [expr {0x80000000 + $page * 4096}] 0xdf]
}
put 0x80006000 [pte 0x100007000 1]
put 0x80006010 [pte 0x100000000 0xcf]
put 0x80007010 [pte 0x10000e000 1]
put 0x8000e000 [pte 0x100004000 0xcf]
reg vsatp 0x8000000000100006
reg hgatp 0x8000000000080008
guest_mode
expect_word 0x00400000 0x13579bdf "VS/G with high-GPA page tables and data"
hardware_load 0x00400000 0x13579bdf "VS/G high-GPA"

# Bare combinations are controls for stage selection.
reg vsatp 0
expect_word 0x100004000 0x13579bdf "VS Bare G Sv39x4"
reg hgatp 0
expect_word 0x80004000 0x13579bdf "VS Bare G Bare"
put 0x80006000 [pte 0x80007000 1]
put 0x80007010 [pte 0x8000e000 1]
put 0x8000e000 [pte 0x80004000 0xcf]
reg vsatp 0x8000000000080006
expect_word 0x00400000 0x13579bdf "VS Sv39 G Bare"
put 0x80006000 [pte 0x100007000 1]
put 0x80007010 [pte 0x10000e000 1]
put 0x8000e000 [pte 0x100004000 0xcf]
reg vsatp 0x8000000000100006
reg hgatp 0x8000000000080008

# Faults must not reach a final side-effecting device, or enter app traps.
put 0x8000d020 [pte 0x10000000 0xdf]
put 0x8000e000 0
expect_failure 0x00400000 "invalid VS leaf"
put 0x8000e000 [pte 0x100004000 0xcf]
put 0x8000d038 0
expect_failure 0x00400000 "invalid G leaf during VS PTE read"
put 0x8000d038 [pte 0x80007000 0xdf]
put 0x8000d020 0
expect_failure 0x00400000 "invalid G leaf for final data"
put 0x8000d020 [pte 0x10000000 0xdf]
check_equal [lindex [read_memory 0x10000028 32 1 phys] 0] 0 "faults have no final device read"
put 0x8000d020 [pte 0x80004000 0xdf]
expect_word 0x00400000 0x13579bdf "recovery after VS/G faults"

# Unsupported NAPOT at either stage must never be silently treated as 4KiB.
put 0x8000d040 [pte 0x80005000 0xdf]
put 0x8000e020 [pte 0x100008000 0x80000000000000cf]
expect_failure 0x00404000 "VS-stage Svnapot unsupported"
put 0x8000d020 [pte 0x80008000 0x80000000000000df]
expect_failure 0x00400000 "G-stage Svnapot unsupported"
put 0x8000e020 [pte 0x100008000 0x80000000000000cf]
expect_failure 0x00404000 "both-stage Svnapot unsupported"

# Leave a reproducible ordinary host context before detach.
reg dcsr $initial_dcsr
reg satp 0
reg vsatp 0
reg hgatp 0
reg mstatus $initial_mstatus
reg menvcfg $initial_menvcfg
echo "PASS OpenOCD translation checks=$checks (Svnapot explicitly unsupported)"
shutdown
