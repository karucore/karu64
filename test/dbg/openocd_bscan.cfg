# Actual OpenOCD nested-TAP encoder against the simulated Xilinx USER4 TAP.
adapter driver remote_bitbang
remote_bitbang host 127.0.0.1
remote_bitbang port $::env(KARUDBG_RBB_PORT)
transport select jtag
adapter speed 1000
reset_config none
telnet port disabled
tcl port disabled
gdb port disabled
jtag newtap karu fpga -irlen 6 -expected-id 0x04b31093
target create karu.cpu riscv -tap karu.fpga -coreid 0
riscv use_bscan_tunnel 5 0
riscv set_bscan_tunnel_ir 0x23
init
# Direct DM operations exercise the same actual target driver's tunnel path.
karu.cpu riscv dmi_write 0x10 1
set status [karu.cpu riscv dmi_read 0x11]
if {($status & 0xff) != 0x83} {error "DM Debug1.0 status: $status"}
foreach pair {{0x04 0x01234567} {0x05 0x89abcdef} {0x04 0xfedcba98}} {
    lassign $pair address value
    karu.cpu riscv dmi_write $address $value
    set actual [karu.cpu riscv dmi_read $address]
    if {$actual != $value} {error "BSCAN DMI $address: $actual != $value"}
}
karu.cpu riscv dmi_write 0x18 0xffffffff
foreach address {0x18 0x38 0x39 0x3c} {
    set actual [karu.cpu riscv dmi_read $address]
    if {$actual != 0} {error "BSCAN absent register $address: $actual"}
}
echo "PASS OpenOCD BSCAN nested TAP DTM CDC DMI"
shutdown
