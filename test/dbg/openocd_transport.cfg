# TAP/DTM/DMI integration against the real DM; no core target in this fixture.
# SPDX-License-Identifier: BSD-2-Clause
adapter driver remote_bitbang
remote_bitbang host 127.0.0.1
remote_bitbang port $::env(KARUDBG_RBB_PORT)
transport select jtag
adapter speed 1000
reset_config none
telnet port disabled
tcl port disabled
gdb port disabled
jtag newtap karu cpu -irlen 5 -expected-id 0x00000db3
init
irscan karu.cpu 0x10
set raw_dtmcs [drscan karu.cpu 32 0]
set dtmcs [expr "0x$raw_dtmcs"]
if {$dtmcs != 0x1071} { error "Unexpected DTMCS: $dtmcs" }

proc dmi_access {address data operation} {
    irscan karu.cpu 0x11
    set request [format 0x%llx [expr {($address << 34) | ($data << 2) | $operation}]]
    drscan karu.cpu 41 $request
    runtest 50
    set raw_response [drscan karu.cpu 41 0]
    set response [expr "0x$raw_response"]
    if {($response & 3) != 0} { error "DMI status $response" }
    return [expr {($response >> 2) & 0xffffffff}]
}
proc check_read {address expected} {
    set value [dmi_access $address 0 1]
    if {$value != $expected} { error "DMI register $address: $value != $expected" }
}

dmi_access 0x10 1 2
set status [dmi_access 0x11 0 1]
if {($status & 0xff) != 0x83} { error "DM not authenticated Debug 1.0: $status" }
check_read 0x16 0x08000002
dmi_access 0x04 0x01234567 2
dmi_access 0x05 0x89abcdef 2
check_read 0x04 0x01234567
check_read 0x05 0x89abcdef
dmi_access 0x18 0xffffffff 2
check_read 0x18 0
check_read 0x38 0
check_read 0x39 0
check_read 0x3c 0
echo "PASS OpenOCD TAP DTM CDC DMI register round trips"
shutdown
