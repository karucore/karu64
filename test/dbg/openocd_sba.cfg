# Native OpenOCD SBA, with Program Buffer/abstract-memory fallback forbidden.
# SPDX-License-Identifier: BSD-2-Clause
source test/dbg/openocd_common.cfg
riscv mem_access sysbus
set sbcs [karu.cpu riscv dmi_read 0x38]
check_equal [expr {($sbcs >> 29) & 7}] 1 "SBA version"
check_equal [expr {($sbcs >> 5) & 0x7f}] 32 "physical address width"
check_equal [expr {$sbcs & 0x1f}] 15 "native SBA widths"

foreach width {8 16 32 64} {
    foreach count {1 2 5} {
        set values {}
        for {set n 0} {$n < $count} {incr n} {
            if {$width == 64} { set value [expr {0x123456789abc0000+$n}] } else {
                set value [expr {(0xabcdef00+$n) & ((1 << $width)-1)}]
            }
            lappend values $value
        }
        write_memory 0x80003000 $width $values
        set actual [read_memory 0x80003000 $width $count]
        for {set n 0} {$n < $count} {incr n} {
            check_equal [lindex $actual $n] [lindex $values $n] "SBA RAM width=$width count=$count item=$n"
        }
    }
}

# Every device side effect is counted: no speculative/trailing block read.
check_equal [lindex [read_memory 0x10000000 32 1] 0] 0x87654321 "SBA read-to-clear value"
check_equal [lindex [read_memory 0x10000028 32 1] 0] 1 "SBA exact one device read"
set consumed 0
foreach count {1 2 5} {
    set fifo [read_memory 0x10000008 32 $count]
    for {set n 0} {$n < $count} {incr n} {
        check_equal [lindex $fifo $n] [expr {0xa5a50000+$consumed+$n}] "SBA FIFO count=$count item=$n"
    }
    incr consumed $count
    check_equal [lindex [read_memory 0x10000020 32 1] 0] $consumed "SBA FIFO exact count"
}
if {![catch {read_memory 0x10000080 32 1}]} { error "Missing SBA device error" }
write_memory 0x80002000 32 {0x89abcdef}
check_equal [lindex [read_memory 0x80002000 32 1] 0] 0x89abcdef "SBA recovery after device error"

# The independent SBA master cannot acquire the hart's private debug aperture.
set before_mepc [read_reg_value mepc]
set before_mcause [read_reg_value mcause]
if {![catch {read_memory 0x00120380 32 1}]} { error "SBA read reached private debug page" }
if {![catch {write_memory 0x00120380 32 {0x12345678}}]} { error "SBA write reached private debug page" }
check_equal [read_reg_value mepc] $before_mepc "SBA fault leaves mepc"
check_equal [read_reg_value mcause] $before_mcause "SBA fault leaves mcause"
check_equal [lindex [read_memory 0x80002000 32 1] 0] 0x89abcdef "SBA recovery after aperture denial"

# Warm the core D-cache deliberately through the Program Buffer, then select
# SBA alone again. A later core read must observe the coherent SBA write.
riscv mem_access progbuf
check_equal [lindex [read_memory 0x80002000 32 1] 0] 0x89abcdef "warm cached word"
riscv mem_access sysbus
write_memory 0x80002000 32 {0x76543210}
riscv mem_access progbuf
check_equal [lindex [read_memory 0x80002000 32 1] 0] 0x76543210 "core cache invalidated by SBA"
riscv mem_access sysbus

# Executable replacement requires hardware fetch synchronization, with no
# debugger-injected FENCE.I or Program Buffer command between write and step.
write_memory 0x80001000 32 {0x02a00513 0x00150513 0x0000006f}
reg pc 0x80001000
step
check_equal [read_reg_value a0] 42 "SBA code first result"
write_memory 0x80001004 32 {0x00250513}
step
check_equal [read_reg_value a0] 44 "SBA replaces prefetched instruction"

# SBA is independent of halt: accesses proceed while the boot loop runs.
reg t0 0
resume 0x80000000
write_memory 0x80002000 64 {0xfedcba9876543210} phys
check_equal [lindex [read_memory 0x80002000 64 1 phys] 0] 0xfedcba9876543210 "running-hart SBA RAM roundtrip"
check_equal [lindex [read_memory 0x10000028 32 1 phys] 0] 1 "running-hart counted MMIO"
halt
wait_halt 2000
if {[read_reg_value t0] == 0} { error "Hart did not progress during SBA" }
check_equal [read_reg_value mepc] $before_mepc "running SBA preserves trap state"
echo "PASS OpenOCD SBA native widths exact MMIO coherent running halt"
shutdown
