# A pristine pinned OpenOCD must expose its unsupported-autoexec block bug.
# SPDX-License-Identifier: BSD-3-Clause
source test/dbg/openocd_common.cfg
write_memory 0x80002000 32 {0x01234567 0x89abcdef 0xdeadbeef}
check_equal [lindex [read_memory 0x80002000 32 1] 0] 0x01234567 "first native write succeeded"
set values [read_memory 0x80002000 32 3]
if {[lindex $values 0] != 0x01234567 || [lindex $values 1] != 0x89abcdef || [lindex $values 2] != 0xdeadbeef} {
    error "unsupported autoexec block mismatch: $values"
}
echo "Unexpected pristine OpenOCD block success"
shutdown
