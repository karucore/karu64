# Load an adapter configuration first. This target shares the FPGA's physical
# TAP through USER4, not a second externally wired RISC-V TAP.
transport select jtag
adapter speed 1000
reset_config none
jtag newtap karu fpga -irlen 6 -expected-id 0x04b31093 -ignore-version
target create karu.cpu riscv -tap karu.fpga -coreid 0
riscv use_bscan_tunnel 5 0
riscv set_bscan_tunnel_ir 0x23
riscv mem_access progbuf
riscv set_command_timeout_sec 2
# Do not allocate a work area in application RAM by default. Use explicit
# physical memory accesses for devices; reads can have device side effects.
